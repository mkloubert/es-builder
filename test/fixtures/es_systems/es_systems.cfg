<?xml version="1.0"?>
<systemList>
  <system>
    <name>amiga</name>
    <fullname>Amiga</fullname>
    <path>/home/emulationstation/RetroPie/roms/amiga</path>
    <extension>.adf .ADF</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ amiga %ROM%</command>
    <platform>amiga</platform>
    <theme>amiga</theme>
  </system>
  <system>
    <name>c64</name>
    <fullname>Commodore 64</fullname>
    <path>/home/emulationstation/RetroPie/roms/c64</path>
    <extension>.d64 .D64 .prg .PRG</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ c64 %ROM%</command>
    <platform>c64</platform>
    <theme>c64</theme>
  </system>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/home/emulationstation/RetroPie/roms/nes</path>
    <extension>.nes .NES</extension>
    <command>/opt/retropie/supplementary/runcommand/runcommand.sh 0 _SYS_ nes %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
</systemList>
