# Firewall for EmuStation. Inbound: SSH (11911), web UI (11944), ICMP and ICMPv6 only.
#
# There is no "flush ruleset" here on purpose. fail2ban keeps its bans in its own table
# "inet f2b-table". The two lines below remove only our own table: the first one makes sure the
# table exists (it does nothing if it is already there), so the delete never fails, also at the
# first load. "destroy table" would do the same in one line, but it needs Linux 6.3 or newer and
# the Debian 12 VM has Linux 6.1. So "systemctl reload nftables" re-creates our rules and leaves
# "inet f2b-table" (and all current bans) untouched.
# The drop-in nftables.service.d/keep-f2b.conf replaces Debian's ExecStop ("nft flush ruleset")
# with the same two commands, so stop and restart keep the fail2ban table too.

table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    tcp dport { 11911, 11944 } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
