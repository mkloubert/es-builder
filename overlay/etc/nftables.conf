# Firewall for EmuStation. Inbound: SSH (11911), web UI (11944), ICMP and ICMPv6 only.
#
# There is no "flush ruleset" here on purpose. fail2ban keeps its bans in its own table
# "inet f2b-table". "destroy table inet filter" (nft 1.0.6 or newer; Debian trixie has 1.1.x)
# removes only our own table, and it does not fail if the table does not exist yet (first
# load). So "systemctl reload nftables" re-creates our rules and leaves "inet f2b-table"
# (and all current bans) untouched.
# The drop-in nftables.service.d/keep-f2b.conf replaces Debian's ExecStop ("nft flush ruleset")
# with "destroy table inet filter", so stop and restart keep the fail2ban table too.

destroy table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    tcp dport { 11911, 11944 } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
