# Debian trixie can start sshd through socket activation (ssh.socket listens on port 22 and
# ignores sshd_config "Port"). app-10-security.sh disables ssh.socket. This drop-in is a
# second guard: if the socket is ever enabled again, it listens on 11911 only.
[Socket]
ListenStream=
ListenStream=0.0.0.0:11911
