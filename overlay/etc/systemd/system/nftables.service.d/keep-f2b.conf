# Debian's nftables.service stops with "nft flush ruleset". That would also delete fail2ban's
# table "inet f2b-table" and all active bans (fail2ban does not rebuild it until it restarts),
# for example on "systemctl restart nftables". Here "stop" removes only our own table.
# Meaning of "systemctl stop nftables": the firewall is off (the host accepts all traffic, which
# is what stopping a firewall means), but the fail2ban table and its bans stay in place.
# ExecStart and ExecReload (nft -f /etc/nftables.conf) are fine: the file starts with
# "table inet filter" + "delete table inet filter" and never flushes the whole ruleset.
# ExecStop does the same: the first command makes sure the table exists, so a second stop does
# not fail. No "destroy table": it needs Linux 6.3, the Debian 12 VM has 6.1. systemd passes the
# quoted text to nft as one argument.
[Service]
ExecStop=
ExecStop=/usr/sbin/nft "table inet filter; delete table inet filter"
