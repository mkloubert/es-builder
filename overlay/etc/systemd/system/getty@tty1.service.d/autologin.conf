# Log in user emulationstation on tty1 without a password. RetroPie's autostart hook
# (/etc/profile.d/10-retropie.sh) then starts the session wrapper, on tty1 only.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin emulationstation --noclear %I $TERM
