# fail2ban jails for EmuStation. Both jails read the systemd journal and ban with nftables.
#
# sshd filter check (Debian trixie, fail2ban 1.1.0-8, OpenSSH 10.0): since OpenSSH 9.8 the
# login messages are logged by "sshd-session", not "sshd". The Debian package patches the
# stock filter for this (patches update-ssh-9.8.diff: "_daemon = sshd(?:-session)?"), so
# filter.d/sshd.conf matches these lines and no sshd.local override is needed. The filter's
# own journalmatch also lists _COMM=sshd-session (update-ssh-10.0.diff); we set a broader
# journalmatch here on purpose: the whole unit ssh.service (Debian unit name, not sshd.service).
# test/bats/fail2ban-filter.bats checks an sshd-session line against the installed filter.

[DEFAULT]
backend = systemd
banaction = nftables-multiport
maxretry = 5
findtime = 1h
bantime = 1h

[sshd]
enabled = true
filter = sshd
port = 11911
journalmatch = _SYSTEMD_UNIT=ssh.service
maxretry = 5
findtime = 1h
bantime = 1h

[emulationstation-web]
enabled = true
filter = emulationstation-web
port = 11944
journalmatch = _SYSTEMD_UNIT=emulationstation-web.service
maxretry = 5
findtime = 1h
bantime = 1h
