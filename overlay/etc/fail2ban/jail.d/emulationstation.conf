# fail2ban jails for EmuStation. Both jails read the systemd journal and ban with nftables.
#
# sshd filter check (Debian 12 bookworm, fail2ban 1.0.2, OpenSSH 9.2): login messages are
# logged by "sshd", which the stock filter.d/sshd.conf matches, so no sshd.local override is
# needed. OpenSSH 9.8 and newer (later Debian) log them as "sshd-session"; Debian's filter
# matches that too ("_daemon = sshd(?:-session)?"). We set a broad journalmatch here on purpose:
# the whole unit ssh.service (Debian unit name, not sshd.service), so both names are read.
# test/bats/fail2ban-filter.bats checks an sshd line and an sshd-session line against the
# installed filter.

[DEFAULT]
backend = systemd
banaction = nftables-multiport
maxretry = 5
findtime = 1h
bantime = 1h

[sshd]
enabled = true
filter = sshd
port = 11911
journalmatch = _SYSTEMD_UNIT=ssh.service
maxretry = 5
findtime = 1h
bantime = 1h

[emulationstation-web]
enabled = true
filter = emulationstation-web
port = 11944
journalmatch = _SYSTEMD_UNIT=emulationstation-web.service
maxretry = 5
findtime = 1h
bantime = 1h
